<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>motolov | Username Swapper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#0a0a0a; color:#f5f5f5; min-height:100vh; }
        #rain-container { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; overflow:hidden; }
        .rain-drop { position:absolute; width:2px; background:linear-gradient(transparent,rgba(180,220,255,0.8)); animation:fall linear infinite; opacity:0.7; }
        @keyframes fall { to { transform:translateY(100vh); } }

        nav { background:rgba(10,10,10,0.8); backdrop-filter:blur(20px); padding:18px 5%; position:fixed; width:100%; z-index:1000; }
        .logo { font-size:26px; font-weight:700; }

        .hero { min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:120px 20px 80px; }
        .badge { background:linear-gradient(90deg,#6d5dfc,#a78bff); color:white; padding:8px 24px; border-radius:50px; font-weight:600; margin-bottom:20px; }
        h1 { font-size:3.4rem; line-height:1.1; margin-bottom:24px; }
        .gradient { background:linear-gradient(90deg,#6d5dfc,#a78bff); -webkit-background-clip:text; color:transparent; }

        .btn { padding:16px 36px; border-radius:12px; font-weight:600; font-size:1.1rem; background:#6d5dfc; color:white; text-decoration:none; display:inline-block; }
        .btn:hover { background:#5b4be8; transform:translateY(-4px); }
    </style>
</head>
<body>
    <div id="rain-container"></div>
    <nav><div class="logo">motolov</div></nav>

    <section class="hero">
        <div class="badge">INSTAGRAM USERNAME SWAPPING</div>
        <h1>Swap Your <span class="gradient">Instagram Username</span><br>Quickly & Safely</h1>
        <p>Professional username swapping service using secure session method.</p>
        <a href="#" onclick="openSwapper()" class="btn">Start Swapping Now →</a>
    </section>

    <script>
        function createRain() {
            const c = document.getElementById('rain-container');
            for(let i=0; i<100; i++){
                const d = document.createElement('div');
                d.className='rain-drop';
                d.style.left = Math.random()*100 + 'vw';
                d.style.animationDuration = (Math.random()*0.5 + 0.35) + 's';
                d.style.animationDelay = Math.random()*-2 + 's';
                c.appendChild(d);
            }
        }
        createRain();

        function openSwapper() {
            alert("Swapper modal would open here.\n\nEnter your license key to continue.");
        }
    </script>
</body>
</html>
